[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "webqa-kit"
version = "0.2.1"
description = "On-demand public website testing with Playwright, accessibility checks, and reviewed-history guidance"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Austin Lubetkin"}]
dependencies = [
  "pytest==8.4.2", "pytest-playwright==0.7.1", "playwright==1.55.0",
  "pytest-json-report==1.5.0", "pytest-html==4.1.1", "jsonschema==4.25.1"
]

[project.optional-dependencies]
dev = ["build==1.3.0", "ruff==0.13.1"]

[project.scripts]
webqa = "webqa.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
webqa = ["schema.json", "app.html", "profiles/*.json", "suite/pytest.ini", "vendor/*"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 110
target-version = "py311"
